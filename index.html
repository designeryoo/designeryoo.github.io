<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>제이스튜디오 | 링크 모음</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      margin: 0;
      background: #f6f5f1;
      color: #222;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      position: relative;
      width: min(360px, 100%);
      min-height: 650px;
      margin: auto;
      padding: 150px 34px 70px;
    }
    header { margin-bottom: 40px; }
    .logo-frame {
      position: relative;
      display: block;
      width: 148px;
      aspect-ratio: 1563 / 390;
      margin-inline: auto;
      overflow: hidden;
      mix-blend-mode: multiply;
    }
    .logo {
      position: absolute;
      top: 0;
      display: block;
      width: 100%;
      height: auto;
      transform: translateY(-38.8%);
    }
    nav { border-bottom: 1px solid #b8b8b2; }
    .link {
      display: flex;
      align-items: center;
      min-height: 68px;
      border-top: 1px solid #b8b8b2;
      color: inherit;
      text-decoration: none;
      font-size: 15px;
    }
    .number { width: 33px; flex: none; color: #92928d; font-family: Georgia, serif; font-size: 12px; }
    .label { flex: 1; }
    .arrow { color: #6e6e69; font-size: 19px; line-height: 1; }
    .link:hover .label, .link:hover .arrow { color: #000; }
    .link:focus-visible { outline: 2px solid #6e6e69; outline-offset: 3px; }
    footer { position: absolute; bottom: 31px; left: 0; right: 0; color: #999; font-size: 10px; text-align: center; }
    @media (max-height: 650px) {
      main { min-height: 620px; padding-top: 120px; }
    }
  </style>
</head>
<body>
  <main>
    <header><span class="logo-frame"><img class="logo" src="j-studio-logo.jpg" alt="J.STUDIO — INTERIOR &amp; ARCHITECTURE" width="1563" height="1563"></span></header>
    <nav aria-label="SNS 및 연락처">
      <a class="link" href="https://www.instagram.com/j.studio_____/" target="_blank" rel="noopener noreferrer"><span class="number">01</span><span class="label">인스타그램</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://www.threads.com/@j.studio_____" target="_blank" rel="noopener noreferrer"><span class="number">02</span><span class="label">스레드</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://open.kakao.com/o/sZuA4LLg" target="_blank" rel="noopener noreferrer"><span class="number">03</span><span class="label">카카오톡 오픈채팅</span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
    <footer>© <span id="year">2026</span> J.STUDIO</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
